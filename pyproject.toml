[project]
name = "omega-mcp-server"
version = "0.1.0"
description = "Omega MCP Server for local agent tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.3.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
