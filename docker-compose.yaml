services:
  omega-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omega_mcp_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
    volumes:
      # Mount tools directory so new tools can be added without rebuilding the image
      - ./src/mcp_server/tools:/app/src/mcp_server/tools
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/sse\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s